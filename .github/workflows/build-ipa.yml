name: build-ipa

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          brew install xcodegen || (brew update && brew install xcodegen)

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project sid9tool.xcodeproj \
            -scheme sid9tool \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            -derivedDataPath "$PWD/DerivedData"

      - name: Run self-check (P1-3 / P1-4 / P1-5)
        run: |
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/sid9-key.pem -out /tmp/sid9-cert.pem -days 365 -nodes -subj "/CN=sid9tool-selfcheck" 2>/dev/null
          openssl pkcs12 -export -out /tmp/sid9.p12 -inkey /tmp/sid9-key.pem -in /tmp/sid9-cert.pem -password pass:selfcheck
          swiftc -o selfcheck main.swift src/sid9tool/Services/MachO.swift src/sid9tool/Services/CodeSigner.swift src/sid9tool/Services/CMS.swift
          ./selfcheck

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find DerivedData/Build/Products -name "sid9tool.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then echo "::error::sid9tool.app not found in build products"; exit 1; fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr sid9tool.ipa Payload
          ls -lh sid9tool.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: sid9tool-unsigned
          path: sid9tool.ipa
          if-no-files-found: error
