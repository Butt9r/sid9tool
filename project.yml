name: sid9tool
options:
  bundleIdPrefix: com.butt9r
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: zh-Hant
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGNING_ALLOWED: "NO"
packages:
  ZipFoundation:
    url: https://github.com/mattgallagher/ZipFoundation
    majorVersion: 0.9.1
targets:
  sid9tool:
    type: application
    platform: iOS
    sources:
      - path: src/sid9tool
    dependencies:
      - package: ZipFoundation
    resources:
      - path: src/sid9tool/Assets.xcassets
    info:
      path: src/sid9tool/Info.plist
      properties:
        CFBundleDisplayName: sid9tool
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.butt9r.sid9tool
        PRODUCT_NAME: sid9tool
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
schemes:
  sid9tool:
    build:
      targets:
        sid9tool: all
    run:
      config: Debug